<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Seller Dashboard | Shahanaaz Mart</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .logout {
            background: white;
            color: #111827;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 6px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            overflow: hidden;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 8px;
            background: #f8f8f8;
            display: block;
        }

        .product-card h3 {
            margin: 12px 0 6px;
        }

        .category {
            color: #666;
            font-size: 14px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-top: 8px;
        }

        .stock {
            margin-top: 6px;
            color: #555;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 12px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save-btn,
        .cancel-btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .save-btn {
            background: #16a34a;
            color: white;
        }

        .cancel-btn {
            background: #ddd;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px;
            }

            .container {
                width: 94%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>Shahanaaz Mart - Seller</h1>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>


<div class="container">


    <div class="welcome">

        <h2 id="sellerName">
            Seller Dashboard
        </h2>

        <p>
            Manage your products from here.
        </p>

    </div>


    <div class="stats">

        <div class="stat-card">

            <h3>Total Products</h3>

            <p id="totalProducts">0</p>

        </div>


        <div class="stat-card">

            <h3>Total Stock</h3>

            <p id="totalStock">0</p>

        </div>


        <div class="stat-card">

            <h3>Seller Status</h3>

            <p style="font-size:20px;">
                Active
            </p>

        </div>

    </div>


    <div class="section">

        <div class="section-header">

            <h2>My Products</h2>

            <button
                class="add-btn"
                onclick="openAddModal()">

                + Add Product

            </button>

        </div>


        <div
            id="productGrid"
            class="product-grid">

            Loading products...

        </div>

    </div>


</div>


<div
    id="productModal"
    class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">
            Add Product
        </h2>


        <form id="productForm">

            <input
                type="hidden"
                id="productId">


            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <select
                    id="productCategory"
                    required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                    <option value="Home">
                        Home
                    </option>

                    <option value="Books">
                        Books
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Price
                </label>

                <input
                    type="number"
                    id="productPrice"
                    min="1"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Stock
                </label>

                <input
                    type="number"
                    id="productStock"
                    min="0"
                    required>

            </div>


            <div class="form-group"
                 id="imageGroup">

                <label>
                    Product Image
                </label>

                <input
                    type="file"
                    id="productImage"
                    accept="image/*">

            </div>


            <div class="modal-buttons">

                <button
                    type="submit"
                    class="save-btn">

                    Save Product

                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>


<script>


// ========================================
// GET SELLER
// ========================================

let user = null;

try {

    user =
        JSON.parse(
            localStorage.getItem("user") || "null"
        );

} catch (error) {

    user = null;

}


if (
    !user ||
    !user.user_id ||
    user.role !== "seller"
) {

    alert("Please login as a seller.");

    window.location.href =
        "login.html";

}


const sellerId =
    Number(user.user_id);


document.getElementById(
    "sellerName"
).innerText =
    "Welcome, " +
    (user.name || "Seller");


// ========================================
// IMAGE URL
// ========================================

function getImageUrl(image) {

    if (!image) {

        return "https://via.placeholder.com/300x200?text=No+Image";

    }


    image =
        String(image).trim();


    // Already a complete URL

    if (
        image.startsWith("http://") ||
        image.startsWith("https://")
    ) {

        return image;

    }


    // Remove old folder names

    image =
        image
            .replace(/^images[\/\\]/i, "")
            .replace(/^image[\/\\]/i, "");


    return (
        "https://shahanaaz-production-4093.up.railway.app/images/" +
        encodeURIComponent(image)
    );

}


// ========================================
// IMAGE FALLBACK
// ========================================

function imageError(img) {

    img.onerror = null;

    img.src =
        "https://via.placeholder.com/300x200?text=No+Image";

}


// ========================================
// LOAD PRODUCTS
// ========================================

async function loadProducts() {

    const grid =
        document.getElementById(
            "productGrid"
        );


    try {

        const response =
            await fetch(
                "https://shahanaaz-production-4093.up.railway.app/api/products/seller/" +
                sellerId
            );


        const products =
            await response.json();


        if (!response.ok) {

            throw new Error(
                products.message ||
                "Failed to load products"
            );

        }


        document.getElementById(
            "totalProducts"
        ).innerText =
            products.length;


        let stockTotal = 0;


        products.forEach(product => {

            stockTotal +=
                Number(product.stock || 0);

        });


        document.getElementById(
            "totalStock"
        ).innerText =
            stockTotal;


        if (products.length === 0) {

            grid.innerHTML = `

                <div
                    class="empty"
                    style="grid-column:1/-1;">

                    <h3>
                        No Products Yet
                    </h3>

                    <p>
                        Add your first product.
                    </p>

                </div>

            `;

            return;

        }


        grid.innerHTML =
            products.map(product => {

                const imageUrl =
                    getImageUrl(
                        product.image
                    );


                return `

                    <div class="product-card">

                        <img
                            src="${imageUrl}"
                            alt="${product.name}"
                            onerror="imageError(this)"
                        >


                        <h3>
                            ${product.name}
                        </h3>


                        <div class="category">
                            ${product.category}
                        </div>


                        <div class="price">
                            ₹${Number(
                                product.price
                            ).toLocaleString("en-IN")}
                        </div>


                        <div class="stock">
                            Stock: ${product.stock}
                        </div>


                        <div class="actions">

                            <button
                                class="edit-btn"
                                onclick='editProduct(${JSON.stringify(product)})'>

                                Edit

                            </button>


                            <button
                                class="delete-btn"
                                onclick="
                                    deleteProduct(
                                        ${product.product_id}
                                    )
                                ">

                                Delete

                            </button>

                        </div>

                    </div>

                `;

            }).join("");


    } catch (error) {

        console.error(error);

        grid.innerHTML = `

            <div
                class="empty"
                style="grid-column:1/-1;">

                <h3>
                    Failed to load products
                </h3>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}


// ========================================
// ADD PRODUCT
// ========================================

function openAddModal() {

    document.getElementById(
        "modalTitle"
    ).innerText =
        "Add Product";


    document.getElementById(
        "productForm"
    ).reset();


    document.getElementById(
        "productId"
    ).value = "";


    document.getElementById(
        "imageGroup"
    ).style.display =
        "block";


    document.getElementById(
        "productModal"
    ).style.display =
        "flex";

}


// ========================================
// EDIT PRODUCT
// ========================================

function editProduct(product) {

    document.getElementById(
        "modalTitle"
    ).innerText =
        "Edit Product";


    document.getElementById(
        "productId"
    ).value =
        product.product_id;


    document.getElementById(
        "productName"
    ).value =
        product.name;


    document.getElementById(
        "productCategory"
    ).value =
        product.category;


    document.getElementById(
        "productPrice"
    ).value =
        product.price;


    document.getElementById(
        "productStock"
    ).value =
        product.stock;


    document.getElementById(
        "imageGroup"
    ).style.display =
        "none";


    document.getElementById(
        "productModal"
    ).style.display =
        "flex";

}


// ========================================
// CLOSE MODAL
// ========================================

function closeModal() {

    document.getElementById(
        "productModal"
    ).style.display =
        "none";

}


// ========================================
// SAVE PRODUCT
// ========================================

document.getElementById(
    "productForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const productId =
            document.getElementById(
                "productId"
            ).value;


        const name =
            document.getElementById(
                "productName"
            ).value.trim();


        const category =
            document.getElementById(
                "productCategory"
            ).value;


        const price =
            Number(
                document.getElementById(
                    "productPrice"
                ).value
            );


        const stock =
            Number(
                document.getElementById(
                    "productStock"
                ).value
            );


        try {


            if (productId) {

                const response =
                    await fetch(
                        "https://shahanaaz-production-4093.up.railway.app/api/products/" +
                        productId,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name:
                                    name,

                                category:
                                    category,

                                price:
                                    price,

                                stock:
                                    stock,

                                seller_id:
                                    sellerId

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to update product"
                    );

                }


                alert(
                    "Product updated successfully!"
                );

            } else {


                const formData =
                    new FormData();


                formData.append(
                    "name",
                    name
                );

                formData.append(
                    "category",
                    category
                );

                formData.append(
                    "price",
                    price
                );

                formData.append(
                    "stock",
                    stock
                );

                formData.append(
                    "seller_id",
                    sellerId
                );


                const image =
                    document.getElementById(
                        "productImage"
                    ).files[0];


                if (image) {

                    formData.append(
                        "image",
                        image
                    );

                }


                const response =
                    await fetch(
                        "https://shahanaaz-production-4093.up.railway.app/api/products",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to add product"
                    );

                }


                alert(
                    "Product added successfully!"
                );

            }


            closeModal();

            loadProducts();


        } catch (error) {

            console.error(error);

            alert(
                error.message
            );

        }

    }
);


// ========================================
// DELETE PRODUCT
// ========================================

async function deleteProduct(productId) {

    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                "https://shahanaaz-production-4093.up.railway.app/api/products/" +
                productId,
                {
                    method: "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        seller_id:
                            sellerId

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete product"
            );

        }


        alert(
            "Product deleted successfully!"
        );


        loadProducts();


    } catch (error) {

        console.error(error);

        alert(
            error.message
        );

    }

}


// ========================================
// LOGOUT
// ========================================

function logout() {

    localStorage.removeItem("user");

    localStorage.removeItem("user_role");

    localStorage.removeItem("user_id");

    window.location.href =
        "login.html";

}


// ========================================
// START
// ========================================

loadProducts();

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Registration | Shahanaaz Mart</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        form {
            display: grid;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1f3c88;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #1f3c88;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }

        .back-link:hover {
            color: #1f3c88;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>Seller Registration</h1>

        <p class="subtitle">
            Create your Shahanaaz Mart seller account
        </p>


        <form id="sellerForm">

            <input
                type="text"
                id="name"
                placeholder="Seller Name"
                required
            >


            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >


            <button type="submit">
                Create Seller Account
            </button>

        </form>


        <p id="message"></p>


        <p class="login-link">

            Already have an account?

            <a href="seller-login.html">
                Seller Login
            </a>

        </p>


        <a
            href="index.html"
            class="back-link">

            ← Back to Home

        </a>

    </div>

</div>


<script>

document
    .getElementById("sellerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            const message =
                document.getElementById(
                    "message"
                );


            // Password check

            if (
                password !==
                confirmPassword
            ) {

                message.style.color =
                    "red";

                message.textContent =
                    "Passwords do not match.";

                return;

            }


            try {

                const response =
                    await fetch(
                        "https://shahanaaz-production-4093.up.railway.app/api/seller/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name:
                                    name,

                                email:
                                    email,

                                password:
                                    password

                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    message.style.color =
                        "red";

                    message.textContent =
                        data.message ||
                        "Registration failed.";

                    return;

                }


                message.style.color =
                    "green";

                message.textContent =
                    "Seller account created successfully!";


                document
                    .getElementById(
                        "sellerForm"
                    )
                    .reset();


                // Go to seller login

                setTimeout(function() {

                    window.location.href =
                        "seller-login.html";

                }, 1500);


            } catch (error) {

                console.error(error);

                message.style.color =
                    "red";

                message.textContent =
                    "Server error. Please try again.";

            }

        }
    );

</script>


</body>

</html>

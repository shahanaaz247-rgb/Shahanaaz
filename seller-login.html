<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Login | Shahanaaz Mart</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        form {
            display: grid;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1f3c88;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register a {
            color: #1f3c88;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Seller Login</h1>

        <p class="subtitle">
            Login to your Shahanaaz Mart seller account
        </p>

        <form id="sellerLoginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="register">
            New seller?
            <a href="seller_register.html">
                Create New Account
            </a>
        </p>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

</div>


<script>

document
    .getElementById("sellerLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");


        try {

            const response =
                await fetch(
                    "https://shahanaaz-production-4093.up.railway.app/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.style.color = "red";

                message.textContent =
                    data.message ||
                    "Invalid email or password.";

                return;
            }


            if (
                !data.user ||
                data.user.role !== "seller"
            ) {

                message.style.color = "red";

                message.textContent =
                    "Seller account required.";

                return;
            }


            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );


            message.style.color = "green";

            message.textContent =
                "Login successful!";


            setTimeout(function() {

                window.location.href =
                    "seller.html";

            }, 700);


        } catch (error) {

            console.error(error);

            message.style.color = "red";

            message.textContent =
                "Server error. Please try again.";

        }

    });

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Shahanaaz Mart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            margin-top: 15px;
            text-align: center;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <p class="subtitle">
        Access marketplace administration
    </p>

    <form id="adminLoginForm">

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="back">
        <a href="index.html">
            ← Back to Home
        </a>
    </div>

</div>

<script>

document.getElementById("adminLoginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(data.message);
            return;

        }

        if (data.user.role !== "admin") {

            alert("This account is not an admin account.");
            return;

        }

        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );

        window.location.href =
            "admin.html";

    } catch (error) {

        alert(
            "Cannot connect to server. Make sure backend is running."
        );

    }

});

</script>

</body>
</html>

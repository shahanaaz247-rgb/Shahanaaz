<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Cart | Shahanaaz Mart</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f7f1e7;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #2f2a24;
        }

        .cart-header {
            padding: 25px 7%;
            background: white;
            border-bottom: 1px solid #e2d7c8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .back-home {
            text-decoration: none;
            color: #2f2a24;
            font-weight: bold;
        }

        .cart-container {
            width: 86%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .cart-card {
            display: flex;
            align-items: center;
            gap: 25px;
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .cart-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 14px;
            background: #f1eadf;
        }

        .cart-details {
            flex: 1;
        }

        .cart-details h3 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .cart-details p {
            margin: 6px 0;
            color: #6d6257;
        }

        .price {
            font-weight: bold;
            color: #222 !important;
        }

        .item-total {
            font-size: 18px;
            font-weight: bold;
            color: #222 !important;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .quantity-box button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: #2f2a24;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity-box span {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .remove-button {
            border: none;
            background: #d9534f;
            color: white;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 10px;
        }

        .cart-summary {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-top: 25px;
            text-align: right;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .cart-summary h2 {
            margin: 0 0 18px;
        }

        .checkout-button {
            border: none;
            padding: 13px 28px;
            border-radius: 10px;
            background: #2f2a24;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .checkout-button:hover {
            opacity: 0.9;
        }

        .empty-cart {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 18px;
            font-size: 20px;
        }

        @media (max-width: 600px) {

            .cart-header {
                padding: 20px;
            }

            .cart-header h1 {
                font-size: 24px;
            }

            .cart-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-image {
                width: 100%;
                height: 180px;
            }

            .cart-summary {
                text-align: center;
            }

        }

    </style>

</head>


<body>


<header class="cart-header">

    <h1>
        🛒 My Cart
    </h1>

    <a
        href="home.html"
        class="back-home">
        ← Continue Shopping
    </a>

</header>


<main class="cart-container">

    <div id="cartItems">
        Loading cart...
    </div>

    <div id="cartTotal"></div>

</main>


<script>

let cartData = [];


/* ================================
   LOAD CART
================================ */

async function loadCart() {

    const userId =
        localStorage.getItem("user_id");


    const cartItems =
        document.getElementById("cartItems");

    const cartTotal =
        document.getElementById("cartTotal");


    if (!userId) {

        cartItems.innerHTML = `
            <div class="empty-cart">
                Please login to view your cart.
            </div>
        `;

        return;
    }


    try {

        const response =
            await fetch(
                "https://shahanaaz-production-4093.up.railway.app/api/cart/"
                + userId
            );


        const cart =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Failed to load cart"
            );

        }


        cartData = cart;

        displayCart();

    }


    catch (error) {

        console.error(
            "Cart loading error:",
            error
        );


        cartItems.innerHTML = `
            <div class="empty-cart">
                Unable to load cart.
            </div>
        `;

        cartTotal.innerHTML = "";

    }

}


/* ================================
   DISPLAY CART
================================ */

function displayCart() {

    const cartItems =
        document.getElementById("cartItems");

    const cartTotal =
        document.getElementById("cartTotal");


    if (cartData.length === 0) {

        cartItems.innerHTML = `
            <div class="empty-cart">
                Your cart is empty.
                <br><br>
                <a href="home.html">
                    Continue Shopping
                </a>
            </div>
        `;

        cartTotal.innerHTML = "";

        return;
    }


    let total = 0;

    let html = "";


    cartData.forEach(item => {

        const itemTotal =
            Number(item.price) *
            Number(item.quantity);


        total += itemTotal;


        const imageName =
            item.image &&
            item.image.includes("/")
                ? item.image.split("/").pop()
                : item.image;


        html += `

            <div class="cart-card">

                <img
                    class="cart-image"
                    src="https://shahanaaz-production-4093.up.railway.app/images/${imageName}"
                    alt="${item.name}"
                    onerror="
                        this.style.display='none';
                    "
                >


                <div class="cart-details">

                    <h3>
                        ${item.name}
                    </h3>

                    <p>
                        ${item.category}
                    </p>

                    <p class="price">
                        Price:
                        ₹${Number(item.price)
                            .toLocaleString("en-IN")}
                    </p>


                    <div class="quantity-box">

                        <button
                            onclick="changeQuantity(
                                ${item.cart_id},
                                ${item.quantity - 1}
                            )">
                            −
                        </button>


                        <span>
                            ${item.quantity}
                        </span>


                        <button
                            onclick="changeQuantity(
                                ${item.cart_id},
                                ${item.quantity + 1}
                            )">
                            +
                        </button>

                    </div>


                    <p class="item-total">
                        Item Total:
                        ₹${itemTotal
                            .toLocaleString("en-IN")}
                    </p>


                    <button
                        class="remove-button"
                        onclick="removeFromCart(
                            ${item.cart_id}
                        )">

                        Remove

                    </button>

                </div>

            </div>

        `;

    });


    cartItems.innerHTML = html;


    cartTotal.innerHTML = `

        <div class="cart-summary">

            <h2>
                Cart Total:
                ₹${total.toLocaleString("en-IN")}
            </h2>

            <button
                class="checkout-button"
                onclick="checkout()">

                Proceed to Checkout

            </button>

        </div>

    `;

}


/* ================================
   CHANGE QUANTITY
================================ */

async function changeQuantity(cartId, quantity) {

    if (quantity <= 0) {

        removeFromCart(cartId);

        return;
    }


    try {

        const response =
            await fetch(
                "https://shahanaaz-production-4093.up.railway.app/api/cart/"
                + cartId,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        quantity: quantity
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to update quantity."
            );

            return;
        }


        loadCart();

    }


    catch (error) {

        console.error(error);

        alert(
            "Server connection failed."
        );

    }

}


/* ================================
   REMOVE FROM CART
================================ */

async function removeFromCart(cartId) {

    try {

        const response =
            await fetch(
                "https://shahanaaz-production-4093.up.railway.app/api/cart/"
                + cartId,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to remove product."
            );

            return;
        }


        loadCart();

    }


    catch (error) {

        console.error(error);

        alert(
            "Server connection failed."
        );

    }

}


/* ================================
   CHECKOUT
================================ */

function checkout() {

    if (cartData.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;
    }


    window.location.href =
        "checkout.html";

}


/* ================================
   LOAD
================================ */

loadCart();

</script>


</body>

</html>
